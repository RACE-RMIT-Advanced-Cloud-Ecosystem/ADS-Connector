server {
  listen              443 ssl default_server;
  listen              [::]:443 ssl default_server ;
  server_name         nginx;

  ssl_certificate     /etc/nginx/certificate.cert;
  ssl_certificate_key /etc/nginx/private-key.key;
  
  proxy_set_header   Host $host;
  proxy_set_header   X-Forwarded-Proto https;

  location  /connector {
    rewrite /connector/(.*) /$1  break;
    proxy_pass         https://connector:8080;
    proxy_redirect     off;
  }

  location  /dashboard {
    client_max_body_size 0;
    rewrite /dashboard/(.*) /$1  break;
    proxy_pass         http://dashboard:3031;
    proxy_redirect     off;
  }

  location  /ide/ {
    proxy_pass         https://172.18.0.1:8000/;
    proxy_ssl_verify   off;
    proxy_redirect     off;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_http_version 1.1;
  }

  location  /dcv/ {
    rewrite /dcv/(.*) /$1  break;
    proxy_pass         https://172.18.0.1:8443;
    proxy_ssl_verify   off;
    proxy_redirect     off;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_http_version 1.1;
  }
}

# Redirect Legacy HTTP Traffic
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}
